# TrueNAS SCALE: Apps -> Discover Apps -> (three dots) -> Install via YAML.
#
# Custom Apps don't load .env files and ${VAR} resolves to an empty string, so
# every value is inlined. Replace the placeholders, but don't commit real
# secrets back to git.
services:
  homelab-music-toolkit:
    image: ghcr.io/mikestecker/docker-homelab-music-toolkit:latest
    container_name: homelab-music-toolkit
    restart: unless-stopped
    # The service account that owns your music. Check yours with
    # `id svc_apps` (or whichever account owns the pool) - don't assume
    # 3000:3000, that's just TrueNAS SCALE's common default.
    user: "REPLACE_WITH_YOUR_UID:REPLACE_WITH_YOUR_GID"
    environment:
      - TZ=REPLACE_WITH_YOUR_TIMEZONE
      # This app holds your Navidrome admin password and can permanently
      # delete library files - Basic Auth is required by default. Pick your
      # own values; this is the login for the web UI, not your Navidrome one.
      - AUTH_USER=admin
      - AUTH_PASS=paste_a_real_password_here
      # Only needed for a reverse-proxy domain name, e.g. toolkit.example.com.
      # - ALLOWED_HOSTS=toolkit.example.com

      # The same Navidrome user AudioMuse logs in as.
      - ND_URL=http://REPLACE_WITH_YOUR_NAS_IP:4533
      - ND_USER=paste_navidrome_user_here
      - ND_PASS=paste_navidrome_password_here

      - AUDIOMUSE_URL=http://REPLACE_WITH_YOUR_NAS_IP:8000
      # From AudioMuse's Setup Wizard.
      - AUDIOMUSE_API_TOKEN=paste_audiomuse_token_here

      # Duplicate finder tuning (unchanged from docker-music-dupes).
      # On otherwise equal copies, keep Tidarr's (Tidal tags) over Lidarr's retags.
      - PREFER_SOURCES=Tidarr
      # On otherwise equal editions, keep the remastered one (false: originals).
      - PREFER_REMASTERS=true
      # Acoustic fingerprints: report (show only), on (use them), or off.
      - FINGERPRINT=report
      # Parallel fpcalc processes; leave empty for every CPU the app may use.
      - FINGERPRINT_WORKERS=
      # Optional Lidarr source lookup. Separate TrueNAS apps can't resolve each
      # other by container name, so use the NAS IP, not a container name.
      - LIDARR_URL=http://REPLACE_WITH_YOUR_NAS_IP:8686
      - LIDARR_API_KEY=paste_lidarr_key_here
      - LIDARR_MUSIC_ROOT=/data/media/music
    volumes:
      - /mnt/REPLACE_WITH_YOUR_POOL/apps/homelab-music-toolkit/config:/config
      # Keep this ONE read-write mount: quarantine stays an instant rename
      # and the m3u fixer's backups land next to the playlists they fix.
      - /mnt/REPLACE_WITH_YOUR_POOL/media/music:/music
    ports:
      - 8095:8095
